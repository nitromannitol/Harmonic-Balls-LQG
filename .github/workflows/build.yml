name: CI

# Builds the library on GitHub-hosted runners (`ubuntu-24.04`: 4 vCPU, 16 GB RAM, 6 h per job) and
# audits the axioms of the counted declarations. The build runs in up to five consecutive stages
# (`build-stage.yml`), each resuming the build of the previous one; a stage runs only if the build is
# not yet complete. The audit job requires the complete build. No `pull_request` trigger: a fork's
# pull request would run with this repository's Actions cache in scope.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'paper/**'
      - 'docs/**'
      - 'notes/**'
      - 'archive/**'
  workflow_dispatch:

# A run is not cancelled by a later push: the later run waits, and resumes from the saved build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The number of `#print axioms` lines of `checks/AxiomGate.lean`; bump with each added or removed line.
  EXPECTED_AXIOM_REPORTS: "390"

jobs:
  stage1:
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 1
  stage2:
    needs: stage1
    if: needs.stage1.outputs.complete != 'true'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 2
  stage3:
    needs: stage2
    if: needs.stage2.outputs.complete != 'true'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 3
  stage4:
    needs: stage3
    if: needs.stage3.outputs.complete != 'true'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 4
  stage5:
    needs: stage4
    if: needs.stage4.outputs.complete != 'true'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 5

  audit:
    name: Complete build and axiom audit
    needs: [stage1, stage2, stage3, stage4, stage5]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Reclaim runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/share/swift /usr/local/share/boost || true
          sudo docker system prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true

      # The most recent build of this commit, or else of these pins (a stage that found the build
      # complete saves nothing); the next step checks that it is complete for this commit.
      - name: Restore the build
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            .lake/packages/*/.lake/build
            !.lake/packages/mathlib/.lake/build
          key: lake-all-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-
          restore-keys: |
            lake-all-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-
            lake-all-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Require the complete build, with no error and no incomplete proof
        shell: bash
        run: |
          set -o pipefail
          lake build --no-build 2>&1 | tee build.log
          if grep -E '^error|declaration uses .sorry|sorryAx' build.log; then
            echo "The library build must have no error and no incomplete proof."
            exit 1
          fi

      # `checks/AxiomGate.lean` prints the axioms of each counted declaration of
      # docs/campaign/COUNTED-MANIFEST.md and of the forms recorded in docs/campaign/AXIOM-GATE.md.
      # Every report must list exactly `propext`, `Classical.choice` and `Quot.sound`, and the
      # number of reports must be EXPECTED_AXIOM_REPORTS.
      - name: Axiom audit of the counted declarations
        shell: bash
        run: |
          set -euo pipefail
          lake env lean checks/AxiomGate.lean 2>&1 | tee axiom-gate.log
          python3 - axiom-gate.log "$EXPECTED_AXIOM_REPORTS" <<'PY'
          import re, sys
          text = open(sys.argv[1]).read()
          expected = int(sys.argv[2])
          reports = []
          for line in text.splitlines():
              if line[:1].isspace() and reports:
                  reports[-1] += ' ' + line.strip()
              elif line.strip():
                  reports.append(line.strip())
          pattern = re.compile(r"^'.+' depends on axioms: \[propext, Classical\.choice, Quot\.sound\]$")
          bad = [r for r in reports if not pattern.match(r)]
          if bad:
              print('Unexpected output of the axiom gate:')
              print('\n'.join(bad[:40]))
              raise SystemExit(1)
          if len(reports) != expected:
              raise SystemExit(f'Expected {expected} standard-axiom reports, saw {len(reports)}.')
          print(f'{len(reports)} declarations, each depending only on propext, Classical.choice and Quot.sound.')
          PY
          test "$(grep -c '^#print axioms' checks/AxiomGate.lean)" -eq "$EXPECTED_AXIOM_REPORTS" \
            || { echo "checks/AxiomGate.lean does not have EXPECTED_AXIOM_REPORTS #print lines."; exit 1; }

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            build.log
            axiom-gate.log
          if-no-files-found: warn
